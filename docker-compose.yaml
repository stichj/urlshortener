services:

  db:
    image: postgres:latest
    container_name: urlshortener-postgres
    restart: always
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:latest
    container_name: urlshortener-redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - cache:/data

  app:
    image: urlshortener
    container_name: urlshortener-app
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
        restart: true
      cache:
          condition: service_started
    ports:
      - "8080:8080"
    env_file: .env
    restart: always

volumes:
  pgdata:
    driver: local
  cache:
    driver: local